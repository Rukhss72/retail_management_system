{% extends "retail/base.html" %}
{% block content %}
<div style="max-width:420px;margin:40px auto;padding:20px;border:1px solid #e5e7eb;border-radius:12px;">
  <h2 style="margin:0 0 12px 0;">Admin Login</h2>

  {% if form.errors %}
    <div style="background:#fee2e2;padding:10px;border-radius:8px;margin-bottom:12px;">
      Invalid details (or role mismatch).
    </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}

    <div style="margin-bottom:12px;">
      <label>Role</label>
      {{ form.role }}
    </div>

    <div style="margin-bottom:12px;">
      <label>Username</label>
      {{ form.username }}
    </div>

    <div style="margin-bottom:12px;">
      <label>Password</label>
      {{ form.password }}
    </div>

    <button type="submit">Log In</button>
  </form>
</div>
{% endblock %}
