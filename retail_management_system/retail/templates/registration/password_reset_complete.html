<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Updated</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
    body { min-height:100vh; background: linear-gradient(135deg, #fdf7f7 0%, #f9f9ff 100%); display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { width: 420px; background:#fff; border-radius:24px; box-shadow:0 20px 40px rgba(0,0,0,0.08); padding:32px 34px; text-align:center; }
    h1 { font-size:26px; color:#4a3a5a; margin-bottom:8px; }
    p { color:#6a5a7a; font-size:15px; margin-bottom:18px; }
    a { display:inline-block; padding:12px 16px; border-radius:12px; background:#ffd6e0; color:#3a2a4a; text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Password Updated</h1>
    <p>Your password has been reset. You can now log in.</p>
    <a href="{% url 'admin_login' %}">Back to Login</a>
  </div>
</body>
</html>
