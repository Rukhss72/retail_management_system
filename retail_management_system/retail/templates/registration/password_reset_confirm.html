<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
    body { min-height:100vh; background: linear-gradient(135deg, #fdf7f7 0%, #f9f9ff 100%); display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { width: 420px; background:#fff; border-radius:24px; box-shadow:0 20px 40px rgba(0,0,0,0.08); padding:32px 34px; text-align:center; }
    h1 { font-size:26px; color:#4a3a5a; margin-bottom:8px; }
    p { color:#6a5a7a; font-size:15px; margin-bottom:18px; }
    input { width:100%; padding:16px; border:2px solid #eaeaf5; border-radius:14px; font-size:16px; margin-bottom:12px; }
    button { width:100%; padding:16px; border:0; border-radius:14px; background:linear-gradient(145deg, #ffd6e0, #ffeaa7, #c8e6c9); color:#3a2a4a; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Set New Password</h1>
    <p>Enter your new password below.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.new_password1 }}
      {{ form.new_password2 }}
      <button type="submit">Update Password</button>
    </form>
  </div>
</body>
</html>
