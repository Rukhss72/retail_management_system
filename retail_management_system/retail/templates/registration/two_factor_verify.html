<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Login - Retail Management System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
    body {
      min-height:100vh;
      background: linear-gradient(135deg, #fdf7f7 0%, #f9f9ff 100%);
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .card {
      width: 420px;
      background: rgba(255,255,255,0.92);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      border: 1px solid rgba(220,220,230,0.5);
      padding: 32px 34px;
      text-align:center;
      animation: fadeInUp 0.7s cubic-bezier(0.17, 0.67, 0.88, 1.01);
    }
    h1 { font-size: 28px; color:#4a3a5a; margin-bottom:8px; }
    p { color:#6a5a7a; font-size:15px; margin-bottom:18px; }
    .input {
      width: 100%;
      padding: 18px;
      border: 2px solid #eaeaf5;
      border-radius: 14px;
      font-size: 18px;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
    }
    .input:focus {
      border-color: #ffd6e0;
      box-shadow: 0 0 0 3px rgba(255,214,224,0.35);
    }
    .btn {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(145deg, #ffd6e0, #ffeaa7, #c8e6c9);
      color: #3a2a4a;
      font-weight: 700;
      cursor: pointer;
      transition: all .35s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn:hover { transform: translateY(-2px); }
    .error {
      background:#ffebee;
      color:#b71c1c;
      border:1px solid #ef9a9a;
      padding:10px 12px;
      border-radius:12px;
      font-size:14px;
      margin-bottom:12px;
    }
    .link {
      display:inline-block;
      margin-top: 12px;
      color:#b0a0c0;
      text-decoration:none;
      font-weight:600;
    }
    .link:hover { color:#ff9aa2; text-decoration:underline; }
    @keyframes fadeInUp {
      from { opacity:0; transform: translateY(25px); }
      to { opacity:1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Verify Login</h1>
    <p>Enter the 6‑digit code sent to your email.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    {% if expired and not error %}
      <div class="error">Code expired. Please resend.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      {{ form.code }}
      <button class="btn" type="submit">Verify</button>
    </form>

    <a class="link" href="{% url 'two_factor_verify' %}?resend=1">Resend code</a>
  </div>
</body>
</html>
