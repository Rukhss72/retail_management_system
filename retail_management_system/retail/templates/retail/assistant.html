{% extends "retail/base.html" %}
{% block title %}Assistant{% endblock %}
{% block content %}
<style>
  .ra-layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 18px;
    width: 100%;
    margin: 0;
    padding-left: 20px;
  }
  .ra-layout.collapsed { grid-template-columns: 56px 1fr; }

  .ra-panel {
    background: #fff;
    border: 1px solid #d8dee6;
    border-radius: 12px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
  }

  .ra-side {
    grid-column: 1;
    grid-row: 1;
    display: grid;
    grid-template-rows: auto 1fr;
    min-height: 72vh;
    overflow: hidden;
  }
  .ra-side-head {
    padding: 12px;
    border-bottom: 1px solid #e6ebf1;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 8px;
    align-items: center;
  }
  .ra-toggle {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    cursor: pointer;
    color: #334155;
  }
  .ra-side-title {
    margin: 0;
    font-size: 14px;
    color: #334155;
    text-align: center;
  }
  .ra-side-actions { display: flex; justify-content: flex-end; }
  .ra-thread-list {
    overflow: auto;
    padding: 8px;
    display: grid;
    gap: 6px;
    max-height: calc(72vh - 70px);
  }
  .ra-thread {
    border: 1px solid #dbe3ef;
    border-radius: 10px;
    background: #f8fafc;
    padding: 9px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .ra-thread.active {
    border-color: #2563eb;
    background: #eef2ff;
  }
  .ra-thread-time {
    font-size: 11px;
    color: #64748b;
    margin-top: 2px;
  }

  .ra-layout.collapsed .ra-side-title,
  .ra-layout.collapsed .ra-side-actions,
  .ra-layout.collapsed .ra-thread-list {
    display: none !important;
  }
  .ra-layout.collapsed .ra-side-head {
    grid-template-columns: 1fr;
    justify-items: center;
    padding: 8px 6px;
  }

  .ra-main {
    grid-column: 2;
    grid-row: 1;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    min-height: 72vh;
  }
  .ra-header {
    padding: 14px;
    border-bottom: 1px solid #e6ebf1;
  }
  .ra-title {
    margin: 0;
    font-size: 24px;
    color: #1f2937;
  }
  .ra-sub {
    margin: 4px 0 0;
    color: #6b7280;
    font-size: 14px;
  }

  .ra-chips {
    padding: 10px 14px;
    border-bottom: 1px solid #e6ebf1;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .ra-chip {
    border: 1px solid #b8c4d3;
    background: #f8fafc;
    color: #1f2937;
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
  }

  .ra-messages {
    padding: 14px;
    overflow: auto;
    max-height: 66vh;
    display: grid;
    gap: 10px;
  }
  .ra-msg {
    border-radius: 12px;
    padding: 10px 12px;
    border: 1px solid #e3e8ef;
    background: #f9fbff;
  }
  .ra-msg.user {
    background: #0f172a;
    color: #fff;
    border-color: #0f172a;
    margin-left: 16%;
  }
  .ra-msg.assistant { margin-right: 10%; }
  .ra-msg-text { margin: 0; line-height: 1.4; }

  .ra-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .ra-pill {
    font-size: 12px;
    background: #eef2ff;
    color: #1e3a8a;
    border-radius: 999px;
    padding: 4px 9px;
  }

  .ra-table-wrap {
    margin-top: 8px;
    overflow: auto;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
  }
  .ra-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .ra-table th, .ra-table td {
    border-bottom: 1px solid #edf2f7;
    padding: 8px;
    text-align: left;
    white-space: nowrap;
  }
  .ra-table th { background: #f8fafc; color: #334155; }

  .ra-chart { margin-top: 10px; display: grid; gap: 8px; }
  .ra-chart-title { font-size: 13px; font-weight: 700; color: #1f2937; }
  .ra-legend { display: flex; gap: 12px; font-size: 12px; color: #334155; }
  .ra-dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; margin-right: 4px; }
  .ra-compare-grid { display: grid; gap: 8px; }
  .ra-compare-row { display: grid; grid-template-columns: 160px 1fr 120px; gap: 8px; align-items: center; font-size: 12px; }
  .ra-track-stack { background: #e2e8f0; border-radius: 999px; height: 10px; position: relative; overflow: hidden; }
  .ra-dumbbell-line { position: absolute; top: 50%; height: 2px; transform: translateY(-50%); background: #94a3b8; border-radius: 999px; }
  .ra-dot-a,.ra-dot-b { position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 999px; transform: translate(-50%, -50%); border: 1px solid rgba(15,23,42,.15); }
  .ra-dot-a { background: #2563eb; }
  .ra-dot-b { background: #14b8a6; }
  .ra-values { font-size: 11px; color: #334155; white-space: nowrap; }

  .ra-inputbar {
    padding: 12px;
    border-top: 1px solid #e6ebf1;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
  }
  .ra-inputbar input {
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 15px;
  }
  .ra-btn {
    border: 0;
    border-radius: 10px;
    background: #111827;
    color: #fff;
    padding: 0 16px;
    cursor: pointer;
  }

  .ra-empty { color: #64748b; font-size: 13px; padding: 14px; }

  .ra-ai-insight {
    background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 100%);
    border: 1px solid #c7d7fe;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    font-size: 14px;
    line-height: 1.6;
    color: #1e293b;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .ra-ai-insight strong { color: #1e3a8a; }
  .ra-ai-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    border-radius: 999px;
    padding: 2px 10px;
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }

  .ra-typing {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 12px;
  }
  .ra-typing-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #6366f1;
    animation: raBounce 1.2s infinite ease-in-out;
  }
  .ra-typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .ra-typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes raBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
  .ra-typing-label {
    font-size: 13px;
    color: #6366f1;
    margin-left: 6px;
    font-style: italic;
  }

  @media (max-width: 860px) {
    .ra-layout { grid-template-columns: 1fr; }
    .ra-side { order: -1; min-height: auto; }
    .ra-thread-list { max-height: 220px; }
    .ra-main, .ra-side { grid-column: auto; grid-row: auto; }
    .ra-layout.collapsed { grid-template-columns: 1fr; }
    .ra-layout.collapsed .ra-side-title,
    .ra-layout.collapsed .ra-side-actions,
    .ra-layout.collapsed .ra-thread-list {
      display: block !important;
    }
  }
</style>

<div class="ra-layout">
  <aside class="ra-panel ra-side">
    <div class="ra-side-head">
      <button id="raToggleThreads" class="ra-toggle" type="button" title="Collapse/Expand"><<</button>
      <h3 class="ra-side-title">Chat History</h3>
      <div class="ra-side-actions"><button id="raNewChat" class="ra-btn" type="button">+ New Chat</button></div>
    </div>
    <div id="raThreadList" class="ra-thread-list"></div>
  </aside>

  <section class="ra-panel ra-main">
    <div class="ra-header">
      <h1 class="ra-title">Retail Assistant</h1>
      <p class="ra-sub">Persistent chat with thread history and memory-aware responses.</p>
    </div>

    <div class="ra-chips">
      <button class="ra-chip" data-query="Total sales today (revenue + quantity)">Today Sales</button>
      <button class="ra-chip" data-query="Show me all low-stock items (below 5)">Low Stock</button>
      <button class="ra-chip" data-query="Top 10 best-selling products this month">Top Sellers (30d)</button>
      <button class="ra-chip" data-query="Predict top 10 best-sellers for next 7 days">Forecast (7d)</button>
      <button class="ra-chip" data-query="What should I restock for next week?">Reorder Suggestions</button>
    </div>

    <div id="raMessages" class="ra-messages">
      <p class="ra-empty">Select a chat on the left, or click New Chat.</p>
    </div>

    <div class="ra-inputbar">
      <input id="raInput" type="text" placeholder="Type your message..." />
      <button id="raSend" class="ra-btn" type="button">Ask</button>
    </div>
  </section>
</div>

<script>
  let activeThreadId = null;
  const layoutRoot = document.querySelector(".ra-layout");
  const messagesRoot = document.getElementById("raMessages");
  const threadRoot = document.getElementById("raThreadList");

  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(";").shift();
    return "";
  }

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }

  function renderMeta(meta, payload) {
    const sourceText = (payload.source && payload.source.length) ? payload.source.join(", ") : "N/A";
    const confidenceText = (typeof payload.parser_confidence === "number") ? ` (${Math.round(payload.parser_confidence * 100)}%)` : "";
    meta.innerHTML = `
      <span class="ra-pill">Intent: ${escapeHtml(payload.intent || "Unknown")}</span>
      <span class="ra-pill">Parser: ${escapeHtml(payload.parser_used || "rules")}${confidenceText}</span>
      <span class="ra-pill">Source: ${escapeHtml(sourceText)}</span>
    `;
  }

  function renderTable(root, table) {
    if (!table || !table.columns || !table.columns.length) return;
    const cols = table.columns;
    const rows = table.rows || [];
    const thead = `<tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join("")}</tr>`;
    const tbody = rows.length
      ? rows.map(r => `<tr>${cols.map(c => `<td>${escapeHtml(r[c])}</td>`).join("")}</tr>`).join("")
      : `<tr><td colspan="${cols.length}">No rows</td></tr>`;
    root.innerHTML = `<table class="ra-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
  }

  function renderCompareChart(root, chartObj) {
    const labels = chartObj.labels || [];
    const datasets = chartObj.datasets || [];
    if (datasets.length !== 2 || !labels.length) return;

    const colorA = "#2563eb";
    const colorB = "#14b8a6";
    const dataA = datasets[0].data || [];
    const dataB = datasets[1].data || [];
    const max = Math.max(...dataA.map(v => Number(v || 0)), ...dataB.map(v => Number(v || 0)), 1);

    const container = document.createElement("div");
    container.className = "ra-chart";
    container.innerHTML = `
      <div class="ra-chart-title">${escapeHtml(chartObj.title || "Comparison")}</div>
      <div class="ra-legend">
        <span><span class="ra-dot" style="background:${colorA}"></span>${escapeHtml(datasets[0].label || "A")}</span>
        <span><span class="ra-dot" style="background:${colorB}"></span>${escapeHtml(datasets[1].label || "B")}</span>
      </div>
    `;

    const grid = document.createElement("div");
    grid.className = "ra-compare-grid";
    labels.slice(0, 12).forEach((label, idx) => {
      const a = Number(dataA[idx] || 0);
      const b = Number(dataB[idx] || 0);
      const aPct = Math.max(0, Math.min(100, (a / max) * 100));
      const bPct = Math.max(0, Math.min(100, (b / max) * 100));
      const left = Math.min(aPct, bPct);
      const width = Math.max(Math.abs(aPct - bPct), 1);

      const row = document.createElement("div");
      row.className = "ra-compare-row";
      row.innerHTML = `
        <div title="${escapeHtml(label)}">${escapeHtml(label)}</div>
        <div class="ra-track-stack">
          <div class="ra-dumbbell-line" style="left:${left}%; width:${width}%"></div>
          <div class="ra-dot-a" style="left:${aPct}%"></div>
          <div class="ra-dot-b" style="left:${bPct}%"></div>
        </div>
        <div class="ra-values">A:${a} | B:${b}</div>
      `;
      grid.appendChild(row);
    });
    container.appendChild(grid);
    root.appendChild(container);
  }

  function renderCharts(root, chart) {
    if (!chart) return;
    const charts = Array.isArray(chart.charts) ? chart.charts : [chart];
    charts.forEach(one => renderCompareChart(root, one));
  }

  function appendMessage(role, text, payload) {
    const msg = document.createElement("div");
    msg.className = `ra-msg ${role}`;
    const body = document.createElement("p");
    body.className = "ra-msg-text";
    body.textContent = text || "";
    msg.appendChild(body);

    if (role === "assistant" && payload && Object.keys(payload).length) {
      // AI insight block (from Ollama)
      if (payload.ai_insight) {
        const insightWrap = document.createElement("div");
        insightWrap.className = "ra-ai-insight";
        const badge = document.createElement("span");
        badge.className = "ra-ai-badge";
        badge.textContent = "\u2728 AI Insight";
        insightWrap.appendChild(badge);
        const insightText = document.createElement("div");
        // basic markdown-ish rendering
        let formatted = escapeHtml(payload.ai_insight);
        formatted = formatted.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
        formatted = formatted.replace(/^[•\-]\s/gm, "\u2022 ");
        insightText.innerHTML = formatted;
        insightWrap.appendChild(insightText);
        msg.appendChild(insightWrap);
      }

      const meta = document.createElement("div");
      meta.className = "ra-meta";
      renderMeta(meta, payload);
      msg.appendChild(meta);

      const tableWrap = document.createElement("div");
      tableWrap.className = "ra-table-wrap";
      renderTable(tableWrap, payload.table || {});
      if (tableWrap.innerHTML) msg.appendChild(tableWrap);

      const chartWrap = document.createElement("div");
      renderCharts(chartWrap, payload.chart);
      if (chartWrap.innerHTML) msg.appendChild(chartWrap);
    }

    messagesRoot.appendChild(msg);
    messagesRoot.scrollTop = messagesRoot.scrollHeight;
  }

  function clearMessages() {
    messagesRoot.innerHTML = "";
  }

  async function loadThreads() {
    const res = await fetch("{% url 'assistant_threads' %}");
    const payload = await res.json();
    if (!payload.ok) return;

    threadRoot.innerHTML = "";
    payload.threads.forEach((t) => {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "ra-thread" + (t.id === activeThreadId ? " active" : "");
      item.innerHTML = `<div>${escapeHtml(t.title)}</div><div class="ra-thread-time">${new Date(t.updated_at).toLocaleString()}</div>`;
      item.addEventListener("click", () => openThread(t.id));
      threadRoot.appendChild(item);
    });

    if (!payload.threads.length) {
      threadRoot.innerHTML = `<p class="ra-empty">No chats yet.</p>`;
    }
  }

  async function createThread(title = "New Chat") {
    const res = await fetch("{% url 'assistant_threads' %}", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
        "X-CSRFToken": getCookie("csrftoken"),
      },
      body: `title=${encodeURIComponent(title)}`,
    });
    const payload = await res.json();
    if (!payload.ok) return null;
    return payload.thread;
  }

  async function openThread(threadId) {
    activeThreadId = threadId;
    await loadThreads();
    clearMessages();
    const res = await fetch(`/assistant/threads/${threadId}/`);
    const payload = await res.json();
    if (!payload.ok) return;

    if (!payload.messages.length) {
      messagesRoot.innerHTML = `<p class="ra-empty">Start chatting in this thread.</p>`;
      return;
    }
    payload.messages.forEach((m) => appendMessage(m.role, m.content, m.payload || {}));
  }

  async function sendMessage(text) {
    if (!activeThreadId) {
      const t = await createThread();
      if (!t) return;
      activeThreadId = t.id;
      await loadThreads();
      clearMessages();
    }

    if (messagesRoot.querySelector(".ra-empty")) clearMessages();
    appendMessage("user", text, {});

    // Show typing indicator
    const typing = document.createElement("div");
    typing.className = "ra-msg assistant";
    typing.id = "raTyping";
    typing.innerHTML = `<div class="ra-typing">
      <div class="ra-typing-dot"></div>
      <div class="ra-typing-dot"></div>
      <div class="ra-typing-dot"></div>
      <span class="ra-typing-label">Analyzing with AI...</span>
    </div>`;
    messagesRoot.appendChild(typing);
    messagesRoot.scrollTop = messagesRoot.scrollHeight;

    const res = await fetch(`/assistant/threads/${activeThreadId}/messages/`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": getCookie("csrftoken"),
      },
      body: JSON.stringify({ query: text }),
    });

    // Remove typing indicator
    const typingEl = document.getElementById("raTyping");
    if (typingEl) typingEl.remove();

    const payload = await res.json();
    if (!payload.ok) {
      appendMessage("assistant", payload.error || "Request failed.", {});
      return;
    }

    const displayText = payload.message.ai_insight || payload.message.summary || "No summary.";
    appendMessage("assistant", displayText, payload.message);
    await loadThreads();
  }

  document.getElementById("raSend").addEventListener("click", async () => {
    const input = document.getElementById("raInput");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    await sendMessage(text);
  });

  document.getElementById("raInput").addEventListener("keydown", async (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("raSend").click();
    }
  });

  document.getElementById("raNewChat").addEventListener("click", async () => {
    const t = await createThread("New Chat");
    if (!t) return;
    await openThread(t.id);
  });

  document.querySelectorAll(".ra-chip").forEach((chip) => {
    chip.addEventListener("click", async () => {
      const q = chip.getAttribute("data-query") || "";
      document.getElementById("raInput").value = q;
      await sendMessage(q);
    });
  });

  (async function init() {
    const savedCollapsed = localStorage.getItem("ra_threads_collapsed");
    if (savedCollapsed === "1") {
      layoutRoot.classList.add("collapsed");
      document.getElementById("raToggleThreads").textContent = ">>";
    }
    await loadThreads();
    const first = threadRoot.querySelector(".ra-thread");
    if (first) {
      first.click();
    }
  })();

  document.getElementById("raToggleThreads").addEventListener("click", () => {
    const collapsed = layoutRoot.classList.toggle("collapsed");
    document.getElementById("raToggleThreads").textContent = collapsed ? ">>" : "<<";
    localStorage.setItem("ra_threads_collapsed", collapsed ? "1" : "0");
  });
</script>
{% endblock %}
