{% extends "retail/base.html" %}
{% block title %}Assistant{% endblock %}
{% block content %}
<style>
  .ra-page {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
  }

  .ra-layout {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    gap: 16px;
    width: 100%;
    min-width: 0;
    margin: 0;
    padding: 0;
  }
  .ra-layout.collapsed { grid-template-columns: 72px minmax(0, 1fr); }

  .ra-panel {
    background: var(--white);
    border: 1px solid rgba(64, 78, 92, 0.12);
    border-radius: 18px;
    box-shadow: 0 3px 10px rgba(20, 30, 40, 0.04);
  }

  .ra-side {
    grid-column: 1;
    grid-row: 1;
    display: grid;
    grid-template-rows: auto 1fr;
    min-height: 72vh;
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(170, 68, 101, 0.05), rgba(255, 255, 255, 0.98) 24%),
      var(--white);
  }
  .ra-side-head {
    padding: 14px;
    border-bottom: 1px solid rgba(64, 78, 92, 0.1);
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    align-items: center;
  }
  .ra-toggle {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid rgba(170, 68, 101, 0.22);
      background: linear-gradient(135deg, rgba(170, 68, 101, 0.12), rgba(54, 116, 181, 0.14));
    cursor: pointer;
    color: var(--berry);
    font-weight: 900;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .ra-toggle:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 16px rgba(170, 68, 101, 0.12);
    border-color: rgba(170, 68, 101, 0.34);
  }
  .ra-side-title {
    margin: 0;
    font-size: 15px;
    font-weight: 900;
    color: var(--charcoal);
    text-align: left;
  }
  .ra-side-actions { display: flex; justify-content: flex-end; }
  .ra-thread-list {
    overflow: auto;
    padding: 10px;
    display: grid;
    gap: 8px;
    max-height: calc(72vh - 70px);
  }
  .ra-thread {
    border: 1px solid rgba(64, 78, 92, 0.1);
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(247, 249, 252, 0.98), rgba(255, 255, 255, 1));
    padding: 12px 13px;
    font-size: 13px;
    cursor: pointer;
    color: var(--charcoal);
    text-align: left;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .ra-thread:hover {
      transform: translateY(-1px);
      border-color: rgba(54, 116, 181, 0.28);
      box-shadow: 0 8px 20px rgba(54, 116, 181, 0.1);
      background: linear-gradient(180deg, rgba(54, 116, 181, 0.08), rgba(255, 255, 255, 1));
  }
  .ra-thread.active {
    border-color: rgba(170, 68, 101, 0.34);
    background: linear-gradient(180deg, rgba(170, 68, 101, 0.12), rgba(237, 191, 198, 0.14));
    box-shadow: 0 10px 24px rgba(170, 68, 101, 0.12);
  }
  .ra-thread-time {
    font-size: 11px;
    color: rgba(64, 78, 92, 0.62);
    margin-top: 5px;
  }

  .ra-layout.collapsed .ra-side-title,
  .ra-layout.collapsed .ra-side-actions,
  .ra-layout.collapsed .ra-thread-list {
    display: none !important;
  }
  .ra-layout.collapsed .ra-side-head {
    grid-template-columns: 1fr;
    justify-items: center;
    padding: 12px 8px;
  }

  .ra-main {
    grid-column: 2;
    grid-row: 1;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    min-width: 0;
    min-height: 72vh;
    overflow: hidden;
      background:
      radial-gradient(circle at top right, rgba(54, 116, 181, 0.12), transparent 24%),
      linear-gradient(180deg, rgba(170, 68, 101, 0.04), rgba(255, 255, 255, 0.98) 22%);
  }
  .ra-header {
    padding: 22px 22px 16px;
    border-bottom: 1px solid rgba(64, 78, 92, 0.08);
  }
  .ra-title {
    margin: 0;
    font-size: 28px;
    color: var(--charcoal);
    font-weight: 900;
  }
  .ra-sub {
    margin: 6px 0 0;
    color: rgba(64, 78, 92, 0.72);
    font-size: 14px;
  }

  .ra-chips {
    padding: 14px 22px 16px;
    border-bottom: 1px solid rgba(64, 78, 92, 0.08);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .ra-chip {
      border: 1px solid rgba(64, 78, 92, 0.12);
      background: rgba(54, 116, 181, 0.09);
    color: var(--charcoal);
    border-radius: 999px;
    padding: 8px 13px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 800;
    transition: transform .15s ease, border-color .15s ease, background .15s ease, color .15s ease;
  }
  .ra-chip:hover {
    transform: translateY(-1px);
    border-color: rgba(170, 68, 101, 0.28);
    background: rgba(170, 68, 101, 0.12);
    color: var(--berry);
  }

  .ra-messages {
    padding: 18px 22px;
    overflow: auto;
    max-height: 66vh;
    display: grid;
    gap: 12px;
    min-width: 0;
    background:
      linear-gradient(180deg, rgba(247, 249, 252, 0.88), rgba(255, 255, 255, 1)),
      var(--white);
  }
  .ra-msg {
    border-radius: 18px;
    padding: 14px 16px;
    border: 1px solid rgba(64, 78, 92, 0.1);
    background: linear-gradient(180deg, rgba(247, 249, 252, 1), rgba(255, 255, 255, 1));
    box-shadow: 0 3px 10px rgba(20, 30, 40, 0.04);
    min-width: 0;
    max-width: 100%;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .ra-msg.user {
    background: linear-gradient(135deg, #aa4465 0%, #8e3a57 100%);
    color: #fff;
    border-color: rgba(170, 68, 101, 0.45);
    margin-left: 16%;
    box-shadow: 0 10px 22px rgba(170, 68, 101, 0.18);
  }
  .ra-msg.assistant {
      margin-right: 10%;
      border-left: 4px solid rgba(54, 116, 181, 0.72);
  }
  .ra-msg-text {
    margin: 0;
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: inherit;
  }

  .ra-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .ra-pill {
      font-size: 12px;
      background: rgba(54, 116, 181, 0.12);
    color: var(--charcoal);
    border-radius: 999px;
    padding: 5px 10px;
    font-weight: 800;
  }

  .ra-table-wrap {
    margin-top: 12px;
    overflow-x: auto;
    overflow-y: hidden;
    border: 1px solid rgba(64, 78, 92, 0.1);
    border-radius: 14px;
    background: var(--white);
    max-width: 100%;
  }
  .ra-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    table-layout: fixed;
  }
  .ra-table th, .ra-table td {
    border-bottom: 1px solid rgba(64, 78, 92, 0.08);
    padding: 10px 12px;
    text-align: left;
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: break-word;
    vertical-align: top;
  }
  .ra-table th {
      background: rgba(54, 116, 181, 0.1);
      color: var(--charcoal);
      font-weight: 900;
  }

  .ra-chart { margin-top: 10px; display: grid; gap: 8px; }
  .ra-chart-title { font-size: 13px; font-weight: 900; color: var(--charcoal); }
  .ra-chart-card {
    border: 1px solid rgba(64, 78, 92, 0.1);
    border-radius: 14px;
    background: var(--white);
    padding: 12px;
  }
  .ra-chart-svg {
    width: 100%;
    height: 220px;
    display: block;
  }
  .ra-chart-axis {
    stroke: rgba(64, 78, 92, 0.2);
    stroke-width: 1;
  }
  .ra-chart-line {
    fill: none;
    stroke: var(--berry);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .ra-chart-area {
    fill: rgba(170, 68, 101, 0.12);
  }
  .ra-chart-bar {
    fill: rgba(170, 68, 101, 0.82);
  }
  .ra-chart-point {
    fill: var(--berry);
    stroke: #fff;
    stroke-width: 2;
  }
  .ra-chart-labels {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 11px;
    color: rgba(64, 78, 92, 0.72);
  }
  .ra-chart-labels span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ra-chart-meta {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 11px;
    color: rgba(64, 78, 92, 0.76);
    font-weight: 700;
  }
  .ra-chart-y-label,
  .ra-chart-x-label {
    text-transform: none;
  }
  .ra-legend { display: flex; gap: 12px; font-size: 12px; color: var(--charcoal); }
  .ra-dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; margin-right: 4px; }
  .ra-compare-grid { display: grid; gap: 8px; }
  .ra-compare-row { display: grid; grid-template-columns: 160px 1fr 120px; gap: 8px; align-items: center; font-size: 12px; }
  .ra-track-stack { background: rgba(64, 78, 92, 0.1); border-radius: 999px; height: 10px; position: relative; overflow: hidden; }
  .ra-dumbbell-line { position: absolute; top: 50%; height: 2px; transform: translateY(-50%); background: rgba(64, 78, 92, 0.35); border-radius: 999px; }
  .ra-dot-a,.ra-dot-b { position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 999px; transform: translate(-50%, -50%); border: 1px solid rgba(15,23,42,.15); }
  .ra-dot-a { background: var(--berry); }
  .ra-dot-b { background: #3674b5; }
  .ra-values { font-size: 11px; color: rgba(64, 78, 92, 0.8); white-space: nowrap; }

  .ra-inputbar {
    padding: 16px 22px 20px;
    border-top: 1px solid rgba(64, 78, 92, 0.08);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
  }
  .ra-inputbar input {
    border: 1px solid rgba(64, 78, 92, 0.14);
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 15px;
    background: #fafafa;
    color: var(--charcoal);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .ra-inputbar input:focus {
      border-color: rgba(54, 116, 181, 0.72);
      box-shadow: 0 0 0 3px rgba(54, 116, 181, 0.16);
      background: var(--white);
  }
  .ra-btn {
    border: 1px solid transparent;
    border-radius: 14px;
    background: var(--berry);
    color: #fff;
    padding: 0 18px;
    cursor: pointer;
    font-weight: 900;
    transition: opacity .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .ra-btn:hover {
    opacity: .95;
    transform: translateY(-1px);
    box-shadow: 0 10px 20px rgba(170, 68, 101, 0.18);
  }

  .ra-empty {
    color: rgba(64, 78, 92, 0.62);
    font-size: 13px;
    padding: 18px;
    border: 1px dashed rgba(64, 78, 92, 0.16);
    border-radius: 16px;
    background: rgba(247, 249, 252, 0.85);
  }
  .ra-typing {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 0;
  }
  .ra-typing-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--berry);
    animation: raBounce 1.2s infinite ease-in-out;
  }
  .ra-typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .ra-typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes raBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
  .ra-typing-label {
    font-size: 13px;
    color: var(--berry);
    margin-left: 6px;
    font-style: italic;
  }

  @media (max-width: 1200px) {
    .ra-page {
      max-width: 100%;
    }
  }
  @media (max-width: 860px) {
    .ra-page {
      width: 100%;
    }
    .ra-layout { grid-template-columns: 1fr; }
    .ra-side { order: -1; min-height: auto; }
    .ra-thread-list { max-height: 220px; }
    .ra-main, .ra-side { grid-column: auto; grid-row: auto; }
    .ra-layout.collapsed { grid-template-columns: 1fr; }
    .ra-layout.collapsed .ra-side-title,
    .ra-layout.collapsed .ra-side-actions,
    .ra-layout.collapsed .ra-thread-list {
      display: block !important;
    }
    .ra-header,
    .ra-chips,
    .ra-messages,
    .ra-inputbar { padding-left: 16px; padding-right: 16px; }
    .ra-msg.user { margin-left: 8%; }
    .ra-msg.assistant { margin-right: 4%; }
    .ra-compare-row { grid-template-columns: 1fr; }
  }
</style>

<div class="ra-page">
<div class="ra-layout">
  <!-- Left sidebar showing saved chat threads -->
  <aside class="ra-panel ra-side">
    <div class="ra-side-head">
      <button id="raToggleThreads" class="ra-toggle" type="button" title="Collapse/Expand"><<</button>
      <h3 class="ra-side-title">Chat History</h3>
      <div class="ra-side-actions"><button id="raNewChat" class="ra-btn" type="button">+ New Chat</button></div>
    </div>
    <div id="raThreadList" class="ra-thread-list"></div>
  </aside>

  <!-- Main assistant panel with title, shortcuts, messages, and input -->
  <section class="ra-panel ra-main">
    <div class="ra-header">
      <h1 class="ra-title">Retail Assistant</h1>
      <p class="ra-sub">Persistent chat with thread history and memory-aware responses.</p>
    </div>

    <!-- Quick prompt chips for common assistant queries -->
    <div class="ra-chips">
      <button class="ra-chip" data-query="Total sales today (revenue + quantity)">Today Sales</button>
      <button class="ra-chip" data-query="List all items that are low stock">Low Stock</button>
      <button class="ra-chip" data-query="Top 10 best-selling products this month">Top Sellers (30d)</button>
      <button class="ra-chip" data-query="Predict top 10 best-sellers for next 7 days">Forecast (7d)</button>
      <button class="ra-chip" data-query="What should I restock for next week?">Reorder Suggestions</button>
    </div>

    <!-- Message area for the active chat thread -->
    <div id="raMessages" class="ra-messages">
      <p class="ra-empty">Select a chat on the left, or click New Chat.</p>
    </div>

    <!-- Input area for sending a new assistant message -->
    <div class="ra-inputbar">
      <input id="raInput" type="text" placeholder="Type your message..." />
      <button id="raSend" class="ra-btn" type="button">Ask</button>
    </div>
  </section>
</div>
</div>

<script>
  // Main assistant script for threads, messages, and response rendering.
  let activeThreadId = null;
  const layoutRoot = document.querySelector(".ra-layout");
  const messagesRoot = document.getElementById("raMessages");
  const threadRoot = document.getElementById("raThreadList");

  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(";").shift();
    return "";
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }

  function renderMeta(meta, payload) {
    const sourceText = (payload.source && payload.source.length) ? payload.source.join(", ") : "N/A";
    const confidenceText = (typeof payload.parser_confidence === "number") ? ` (${Math.round(payload.parser_confidence * 100)}%)` : "";
    meta.innerHTML = `
      <span class="ra-pill">Intent: ${escapeHtml(payload.intent || "Unknown")}</span>
      <span class="ra-pill">Parser: ${escapeHtml(payload.parser_used || "rules")}${confidenceText}</span>
      <span class="ra-pill">Source: ${escapeHtml(sourceText)}</span>
    `;
  }

  function renderTable(root, table) {
    if (!table || !table.columns || !table.columns.length) return;
    const cols = table.columns;
    const rows = table.rows || [];
    const thead = `<tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join("")}</tr>`;
    const tbody = rows.length
      ? rows.map(r => `<tr>${cols.map(c => `<td>${escapeHtml(r[c])}</td>`).join("")}</tr>`).join("")
      : `<tr><td colspan="${cols.length}">No rows</td></tr>`;
    root.innerHTML = `<table class="ra-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
  }

  function renderCompareChart(root, chartObj) {
    const labels = chartObj.labels || [];
    const datasets = chartObj.datasets || [];
    if (datasets.length !== 2 || !labels.length) return;

    const colorA = "#AA4465";
    const colorB = "#3674b5";
    const dataA = datasets[0].data || [];
    const dataB = datasets[1].data || [];
    const max = Math.max(...dataA.map(v => Number(v || 0)), ...dataB.map(v => Number(v || 0)), 1);

    const container = document.createElement("div");
    container.className = "ra-chart";
    container.innerHTML = `
      <div class="ra-chart-title">${escapeHtml(chartObj.title || "Comparison")}</div>
      <div class="ra-legend">
        <span><span class="ra-dot" style="background:${colorA}"></span>${escapeHtml(datasets[0].label || "A")}</span>
        <span><span class="ra-dot" style="background:${colorB}"></span>${escapeHtml(datasets[1].label || "B")}</span>
      </div>
    `;

    const grid = document.createElement("div");
    grid.className = "ra-compare-grid";
    labels.slice(0, 12).forEach((label, idx) => {
      const a = Number(dataA[idx] || 0);
      const b = Number(dataB[idx] || 0);
      const aPct = Math.max(0, Math.min(100, (a / max) * 100));
      const bPct = Math.max(0, Math.min(100, (b / max) * 100));
      const left = Math.min(aPct, bPct);
      const width = Math.max(Math.abs(aPct - bPct), 1);

      const row = document.createElement("div");
      row.className = "ra-compare-row";
      row.innerHTML = `
        <div title="${escapeHtml(label)}">${escapeHtml(label)}</div>
        <div class="ra-track-stack">
          <div class="ra-dumbbell-line" style="left:${left}%; width:${width}%"></div>
          <div class="ra-dot-a" style="left:${aPct}%"></div>
          <div class="ra-dot-b" style="left:${bPct}%"></div>
        </div>
        <div class="ra-values">A:${a} | B:${b}</div>
      `;
      grid.appendChild(row);
    });
    container.appendChild(grid);
    root.appendChild(container);
  }

  function renderBasicChart(root, chartObj) {
    const labels = chartObj.labels || [];
    const dataset = (chartObj.datasets || [])[0];
    if (!dataset || !labels.length) return;

    const values = (dataset.data || []).map(v => Number(v || 0));
    if (!values.length) return;

    const width = 640;
    const height = 220;
    const padLeft = 22;
    const padRight = 14;
    const padTop = 12;
    const padBottom = 24;
    const innerWidth = width - padLeft - padRight;
    const innerHeight = height - padTop - padBottom;
    const max = Math.max(...values, 1);

    const container = document.createElement("div");
    container.className = "ra-chart";
    container.innerHTML = `
      <div class="ra-chart-title">${escapeHtml(chartObj.title || dataset.label || "Chart")}</div>
      <div class="ra-legend">
        <span><span class="ra-dot" style="background:var(--berry)"></span>${escapeHtml(dataset.label || "Value")}</span>
      </div>
      <div class="ra-chart-card"></div>
    `;

    const card = container.querySelector(".ra-chart-card");
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("class", "ra-chart-svg");

    const axisX = document.createElementNS(svgNS, "line");
    axisX.setAttribute("x1", padLeft);
    axisX.setAttribute("y1", padTop + innerHeight);
    axisX.setAttribute("x2", width - padRight);
    axisX.setAttribute("y2", padTop + innerHeight);
    axisX.setAttribute("class", "ra-chart-axis");
    svg.appendChild(axisX);

    if ((chartObj.type || "").toLowerCase() === "line") {
      const step = labels.length > 1 ? innerWidth / (labels.length - 1) : innerWidth / 2;
      const points = values.map((value, idx) => {
        const x = padLeft + (labels.length > 1 ? idx * step : innerWidth / 2);
        const y = padTop + innerHeight - ((value / max) * innerHeight);
        return { x, y, value };
      });

      const linePath = points.map((p, idx) => `${idx === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
      const areaPath = `${linePath} L ${points[points.length - 1].x} ${padTop + innerHeight} L ${points[0].x} ${padTop + innerHeight} Z`;

      const area = document.createElementNS(svgNS, "path");
      area.setAttribute("d", areaPath);
      area.setAttribute("class", "ra-chart-area");
      svg.appendChild(area);

      const line = document.createElementNS(svgNS, "path");
      line.setAttribute("d", linePath);
      line.setAttribute("class", "ra-chart-line");
      svg.appendChild(line);

      points.forEach((p) => {
        const circle = document.createElementNS(svgNS, "circle");
        circle.setAttribute("cx", p.x);
        circle.setAttribute("cy", p.y);
        circle.setAttribute("r", 4);
        circle.setAttribute("class", "ra-chart-point");
        svg.appendChild(circle);
      });
    } else {
      const barWidth = Math.max(innerWidth / Math.max(values.length * 1.8, 1), 10);
      const gap = values.length > 0 ? innerWidth / values.length : innerWidth;
      values.forEach((value, idx) => {
        const barHeight = (value / max) * innerHeight;
        const rect = document.createElementNS(svgNS, "rect");
        rect.setAttribute("x", padLeft + idx * gap + (gap - barWidth) / 2);
        rect.setAttribute("y", padTop + innerHeight - barHeight);
        rect.setAttribute("width", barWidth);
        rect.setAttribute("height", Math.max(barHeight, 1));
        rect.setAttribute("rx", 6);
        rect.setAttribute("class", "ra-chart-bar");
        svg.appendChild(rect);
      });
    }

    card.appendChild(svg);

    const metaRow = document.createElement("div");
    metaRow.className = "ra-chart-meta";
    metaRow.innerHTML = `
      <span class="ra-chart-y-label">Y-axis: ${escapeHtml(dataset.label || "Value")}</span>
      <span class="ra-chart-x-label">X-axis: Date</span>
    `;
    card.appendChild(metaRow);

    const labelsRow = document.createElement("div");
    labelsRow.className = "ra-chart-labels";
    const labelIndexes = labels.length <= 6 ? labels.map((_, idx) => idx) : [0, Math.floor(labels.length / 2), labels.length - 1];
    labelIndexes.forEach((idx) => {
      const span = document.createElement("span");
      span.textContent = labels[idx];
      span.title = labels[idx];
      labelsRow.appendChild(span);
    });
    card.appendChild(labelsRow);
    root.appendChild(container);
  }

  function renderCharts(root, chart, payload) {
    if (!payload || !chart) return;
    if ((payload.intent || "") !== "CompareSales") return;
    const charts = Array.isArray(chart.charts) ? chart.charts : [chart];
    charts.forEach((one) => {
      const datasets = one.datasets || [];
      const type = (one.type || "").toLowerCase();
      if (datasets.length === 2 && !type) {
        renderCompareChart(root, one);
        return;
      }
      renderBasicChart(root, one);
    });
  }

  function appendMessage(role, text, payload) {
    const msg = document.createElement("div");
    msg.className = `ra-msg ${role}`;
    const body = document.createElement("p");
    body.className = "ra-msg-text";
    body.textContent = text || "";
    msg.appendChild(body);

    if (role === "assistant" && payload && Object.keys(payload).length) {
      const meta = document.createElement("div");
      meta.className = "ra-meta";
      renderMeta(meta, payload);
      msg.appendChild(meta);

      const tableWrap = document.createElement("div");
      tableWrap.className = "ra-table-wrap";
      renderTable(tableWrap, payload.table || {});
      if (tableWrap.innerHTML) msg.appendChild(tableWrap);

      const chartWrap = document.createElement("div");
      renderCharts(chartWrap, payload.chart, payload);
      if (chartWrap.innerHTML) msg.appendChild(chartWrap);
    }

    messagesRoot.appendChild(msg);
    messagesRoot.scrollTop = messagesRoot.scrollHeight;
  }

  function clearMessages() {
    messagesRoot.innerHTML = "";
  }

  async function loadThreads() {
    const res = await fetch("{% url 'assistant_threads' %}");
    const payload = await res.json();
    if (!payload.ok) return;

    threadRoot.innerHTML = "";
    payload.threads.forEach((t) => {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "ra-thread" + (t.id === activeThreadId ? " active" : "");
      item.innerHTML = `<div>${escapeHtml(t.title)}</div><div class="ra-thread-time">${new Date(t.updated_at).toLocaleString()}</div>`;
      item.addEventListener("click", () => openThread(t.id));
      threadRoot.appendChild(item);
    });

    if (!payload.threads.length) {
      threadRoot.innerHTML = `<p class="ra-empty">No chats yet.</p>`;
    }
  }

  async function createThread(title = "New Chat") {
    const res = await fetch("{% url 'assistant_threads' %}", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
        "X-CSRFToken": getCookie("csrftoken"),
      },
      body: `title=${encodeURIComponent(title)}`,
    });
    const payload = await res.json();
    if (!payload.ok) return null;
    return payload.thread;
  }

  async function openThread(threadId) {
    activeThreadId = threadId;
    await loadThreads();
    clearMessages();
    const res = await fetch(`/assistant/threads/${threadId}/`);
    const payload = await res.json();
    if (!payload.ok) return;

    if (!payload.messages.length) {
      messagesRoot.innerHTML = `<p class="ra-empty">Start chatting in this thread.</p>`;
      return;
    }
    payload.messages.forEach((m) => appendMessage(m.role, m.content, m.payload || {}));
  }

  async function sendMessage(text) {
    if (!activeThreadId) {
      const t = await createThread();
      if (!t) return;
      activeThreadId = t.id;
      await loadThreads();
      clearMessages();
    }

    if (messagesRoot.querySelector(".ra-empty")) clearMessages();
    appendMessage("user", text, {});

    // Show typing indicator
    const typing = document.createElement("div");
    typing.className = "ra-msg assistant";
    typing.id = "raTyping";
    typing.innerHTML = `<div class="ra-typing">
      <div class="ra-typing-dot"></div>
      <div class="ra-typing-dot"></div>
      <div class="ra-typing-dot"></div>
      <span class="ra-typing-label">Analyzing with AI...</span>
    </div>`;
    messagesRoot.appendChild(typing);
    messagesRoot.scrollTop = messagesRoot.scrollHeight;

    const res = await fetch(`/assistant/threads/${activeThreadId}/messages/`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": getCookie("csrftoken"),
      },
      body: JSON.stringify({ query: text }),
    });

    // Remove typing indicator
    const typingEl = document.getElementById("raTyping");
    if (typingEl) typingEl.remove();

    const payload = await res.json();
    if (!payload.ok) {
      appendMessage("assistant", payload.error || "Request failed.", {});
      return;
    }

    const displayText = payload.message.answer_text || payload.message.summary || "No response.";
    appendMessage("assistant", displayText, payload.message);
    await loadThreads();
  }

  document.getElementById("raSend").addEventListener("click", async () => {
    const input = document.getElementById("raInput");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    await sendMessage(text);
  });

  document.getElementById("raInput").addEventListener("keydown", async (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("raSend").click();
    }
  });

  document.getElementById("raNewChat").addEventListener("click", async () => {
    const t = await createThread("New Chat");
    if (!t) return;
    await openThread(t.id);
  });

  document.querySelectorAll(".ra-chip").forEach((chip) => {
    chip.addEventListener("click", async () => {
      const q = chip.getAttribute("data-query") || "";
      document.getElementById("raInput").value = q;
      await sendMessage(q);
    });
  });

  (async function init() {
    const savedCollapsed = localStorage.getItem("ra_threads_collapsed");
    if (savedCollapsed === "1") {
      layoutRoot.classList.add("collapsed");
      document.getElementById("raToggleThreads").textContent = ">>";
    }
    await loadThreads();
    const first = threadRoot.querySelector(".ra-thread");
    if (first) {
      first.click();
    }
  })();

  document.getElementById("raToggleThreads").addEventListener("click", () => {
    const collapsed = layoutRoot.classList.toggle("collapsed");
    document.getElementById("raToggleThreads").textContent = collapsed ? ">>" : "<<";
    localStorage.setItem("ra_threads_collapsed", collapsed ? "1" : "0");
  });
</script>
{% endblock %}
